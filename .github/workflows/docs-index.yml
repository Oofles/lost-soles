name: docs-index

# A section index whose line numbers are wrong is worse than no index: it sends
# you to the wrong place confidently. This fails the build if docs changed and
# the index was not regenerated.
#
# 0013 owns the full PR gate (typecheck / lint / test). When it lands, fold this
# job into it and delete this file.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: docs/INDEX.md is up to date
        run: node scripts/build-index.mjs --check
