name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a secret committed and later removed is still in
          # history, and history is what an attacker clones (D-165: public repo).
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Ticket 0115. This used to be `gitleaks/gitleaks-action@v2`, which on a push
      # event scans only the pushed commit range — fetch-depth 0 did not change that.
      # The script runs `gitleaks detect --log-opts=--all` over every ref, refuses a
      # shallow clone, and installs a version- and sha256-pinned gitleaks. The same
      # script runs in amplify.yml (D-163). The self-test plants a secret, deletes it
      # in the next commit, and requires the scan to still find it.
      - name: history scan self-test (a removed secret is still found)
        run: node scripts/check-history-secrets.mjs --install --self-test

      - name: gitleaks over the full git history
        run: node scripts/check-history-secrets.mjs --install
