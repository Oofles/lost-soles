name: gate

# The correctness gate: typecheck, lint, tests, and the D-100 adapter boundary.
#
# Named `gate.yml`, not `pr.yml` (as ticket 0013 originally specified), because it
# runs on PUSH TO MAIN. D-150 settled that this is a solo repo with no PR flow —
# `main` is the only branch — so a pull_request-only workflow would sit dormant and
# gate nothing. That is precisely the inherited failure mode 0013 exists to avoid:
# devaultsecurity's one workflow triggers on `main` in a repo whose default branch
# is `master`, and has therefore never run. `pull_request` is kept as well so the
# gate still works if a branch is ever used.
#
# This workflow is an ALARM, not a lock — branch protection is unavailable on this
# account (D-163), so a red run here does not block anything. The LOCK is
# amplify.yml, which runs these same checks on the deploy path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run tells you nothing. Cancel it rather than pay for it.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc   # 22 — pinned, never inherited
          cache: npm

      # `npm install --no-save`, NOT `npm ci` — D-162. npm ci cannot install the
      # Amplify Gen 2 dependency set at all: data-construct and graphql-api-construct
      # ship internally inconsistent BUNDLED trees and ci refuses with ~94 "Missing
      # ... from lock file" lines. Verified again from a clean directory on
      # 2026-08-31 while building this workflow. --no-save installs from the
      # committed lock and leaves it byte-identical. Mirrors amplify.yml exactly,
      # which is the point of this gate. Revert both under ticket 0128.
      - name: install (from the committed lockfile)
        run: npm install --no-save --prefer-offline

      # The lock guarantee --no-save costs us, bought back cheaply: if the lockfile
      # drifted from package.json, the install rewrites it and this fails.
      - name: package-lock.json is unchanged by the install
        run: git diff --exit-code package-lock.json

      # amplify_outputs.json is GITIGNORED — generated per-environment by the
      # backend deploy (0004: ignored because it is environment-specific, not
      # because it is sensitive). So it exists locally and in the Amplify build,
      # but NOT in a fresh clone, and `components/auth-gate.tsx` imports it.
      #
      # This is 01-architecture.md §6's inherited warning playing out in reverse:
      # the usual failure is CI being stricter than local, here it is CI simply
      # lacking a generated file. Found by this gate on 0014, which is the whole
      # reason the gate exists. The committed example carries the real SHAPE with
      # obviously-fake values, so typecheck is meaningful rather than stubbed out.
      - name: provide amplify_outputs.json for typecheck (never overwrite a real one)
        run: cp -n amplify_outputs.example.json amplify_outputs.json || true

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      # D-100 (01-architecture.md §3 T1). Passes trivially today — the domain is
      # empty — which is exactly why it is added now rather than after a leak.
      - name: D-100 boundary check self-test
        run: node scripts/check-boundaries.mjs --self-test

      - name: D-100 boundary — no Strava type outside the adapter
        run: node scripts/check-boundaries.mjs

      # D-121.1, ticket 0156. The other half of 0027's T2. `check-boundaries.mjs` and
      # `registry.test.ts` read IMPORT STATEMENTS; this asks the compiler what breaks if
      # the adapter directory vanishes, and the only acceptable answer is one file. An
      # import scan cannot see a duplicated structural type, an `as` cast to a shape the
      # adapter owns, or a branch on a source-id string literal — this can.
      #
      # It copies the tree to a scratch directory and symlinks node_modules, so it never
      # writes inside the repo; ~6s.
      - name: deleted-adapter simulation self-test
        run: node scripts/check-adapter-deletion.mjs --self-test

      - name: D-121.1 — deleting an adapter breaks only registry.ts
        run: node scripts/check-adapter-deletion.mjs

      # 06-ui-ux.md §8. Landed in 0016 while there are almost no components, for
      # the same reason the D-100 grep landed while the domain was empty: a
      # palette rule added after the palette has leaked has already failed.
      - name: design tokens check self-test
        run: node scripts/check-design-tokens.mjs --self-test

      - name: design tokens — no raw colour outside app/tokens.css
        run: node scripts/check-design-tokens.mjs

      # D-217 / ticket 0047. rules/xp-rules-v*.json is what the ingest Lambda imports:
      # the YAML cannot be read from inside a bundled function and T5 does not exist
      # until capability 09. A stale .json means the deployed worker is scoring against
      # a ruleset nobody reviewed — including `revealsGround`, which decides whether an
      # activity's cells are written at all and cannot be taken back (D-189, D-020).
      - name: generated rules JSON matches its YAML
        run: node scripts/build-rules-json.mjs --check

      # 05 §2.3 / ticket 0046. REVEAL_R_M (65 m, scoring, permanent under D-020) and
      # revealScale (~102 m, a shader look) are different numbers for different jobs.
      # Landed while the renderer does not exist yet, for the same reason the D-100 grep
      # landed while the domain was empty: after the leak is too late, and a map that
      # cannot re-fog cannot be corrected by editing the constant back.
      - name: fog/render boundary check self-test
        run: node scripts/check-fog-render-boundary.mjs --self-test

      - name: the render radius never reaches the domain that owns REVEAL_R_M
        run: node scripts/check-fog-render-boundary.mjs

      # 02 §5.6 / ticket 0049. AP-16's full-table Query is ~1,000-3,000 RRU against
      # AP-15's ~3-10, and §5.6 calls reaching it from `process-activity` a
      # review-blocking bug. A transitive import walk, because a grep is satisfied by
      # moving the import one file away. The role's missing `dynamodb:Query` on T6 is
      # the other half — a gate can be skipped, a missing action cannot.
      - name: fog hot-path check self-test
        run: node scripts/check-fog-hot-path.mjs --self-test

      - name: the ingest worker cannot reach the full-table rebuild
        run: node scripts/check-fog-hot-path.mjs

      # Ticket 0053. The gate has no LOST_SOLES_HOME_* values, so only the self-test
      # is meaningful here; the real scan runs in the Amplify build container, which
      # does. A self-test that passes proves the detector still bites.
      - name: home coordinate client-bundle check self-test
        run: node scripts/check-home-not-in-client.mjs --self-test

      # Ticket 0053. MapLibre 6 derives its worker URL from `import.meta.url`, which
      # webpack inlines as a build-machine file:// path — so MapLibre's own guard
      # yields an empty worker URL, the browser resolves it against the page, and the
      # server answers with HTML. The map then paints its background layer and no
      # tiles. The self-test proves the copy script still recognises the worker's
      # import shape; if MapLibre changes it, this fails here rather than shipping a
      # worker whose sibling import 404s.
      - name: maplibre worker copy self-test
        run: node scripts/copy-maplibre-worker.mjs --self-test

      # 05 §4.6 / ticket 0053. deck.gl is the ruled-out approach most likely to be
      # retried, because it is the one that is nearly right: correct architecture,
      # wrong ergonomics. Its MaskExtension tests the mask as a BOOLEAN in the
      # fragment shader, so there is no feather, no alpha ramp and no noise hook —
      # which is most of what the fog design is. Reads the LOCKFILE, because deck.gl
      # arriving transitively costs the bundle exactly as much as installing it.
      - name: deck.gl check self-test
        run: node scripts/check-no-deckgl.mjs --self-test

      - name: deck.gl is not in the dependency tree
        run: node scripts/check-no-deckgl.mjs

      # 08 §7.2 / D-199 (ticket 0168). This repo is PUBLIC, and the operator's
      # traces are the sensitive asset the whole of 08 §2 is about. §7.2 always
      # said "test fixtures are synthetic coordinates"; nothing enforced it, and
      # ticket 0038 went on to instruct the opposite in good faith. The check is
      # an ALLOWLIST — every committed coordinate must sit in one box in the
      # South Pacific — because a denylist would have to name where the operator
      # really runs, which is the leak written down to prevent the leak.
      - name: fixture geography check self-test
        run: node scripts/check-fixture-geography.mjs --self-test

      - name: no committed fixture carries a real location
        run: node scripts/check-fixture-geography.mjs

      # 0125. The suite that exercises .githooks/pre-commit rides in `npm test`
      # above, so it runs on both CI surfaces. This is the separate, cheaper
      # assertion the ticket asks for: a syntax check that holds even if vitest
      # itself is broken. Note it would NOT have caught the defect that motivated
      # 0125 — that hook was syntactically valid throughout, and only the
      # behavioural tests found it. Kept because it is nearly free, not because
      # it is the guard.
      - name: pre-commit hook is valid bash
        run: bash -n .githooks/pre-commit

      # ── the bundle-leak check (0017) ────────────────────────────────────────
      #
      # This job holds NO AWS CREDENTIALS, deliberately (0017: adding an OIDC role
      # here would put SSM read access in a second place, to buy a duplicate of a
      # check the deploy path already runs under real credentials). So the two
      # halves split:
      #
      #   HERE    the generic credential patterns over the built client output,
      #           plus a self-test that proves the LITERAL scanner fires against a
      #           planted secret. The scanner cannot rot unnoticed.
      #   AMPLIFY the literal scan, with --require-literals, reading the real
      #           values from SSM. D-163: this workflow is the alarm, amplify.yml
      #           is the lock.
      #
      # The build is here only because the check needs .next/static to exist. It
      # is a genuine second benefit: until now a Next build error surfaced first
      # at deploy time.
      - name: build (the leak check needs .next/static to exist)
        run: npm run build

      - name: bundle leak check self-test
        run: node scripts/check-bundle-leak.mjs --self-test

      - name: no secret in built output (patterns; literals are the deploy path's job)
        run: node scripts/check-bundle-leak.mjs

      # ── hygiene, and it runs LAST on purpose (D-177, ticket 0140) ────────────
      #
      # Folded in from docs-index.yml, per the note that file carried naming 0013
      # as its owner. A section index whose line numbers are wrong is worse than no
      # index: it sends you to the wrong place confidently. So it still FAILS the
      # job — it is not `continue-on-error`, which would let the index rot silently
      # and is the opposite of what D-151 needs.
      #
      # But it sits at the END now. It used to run before the build, and because
      # Actions steps are fail-fast, a stale docs index meant `npm run build` and
      # BOTH bundle-leak scans never ran — fifteen consecutive pushes where this
      # capability's own security check was dark behind a documentation nit.
      #
      # THE RULE: order this job by SEVERITY, not by cost. Cheapest-first is the
      # normal instinct and it is wrong here, because it lets the least serious
      # check mask the most serious one. Anything whose failure means "something
      # unsafe shipped" runs before anything whose failure means "a document is
      # untidy". New checks go above this line unless they are hygiene.
      - name: docs/INDEX.md is up to date
        run: node scripts/build-index.mjs --check
