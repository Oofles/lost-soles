name: tickets

# The ticket system is load-bearing infrastructure for this project: if
# tickets.mjs is wrong, the backlog silently rots. Validate on every push.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tickets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: skills parse (0123 — a broken SKILL.md is silently skipped)
        run: node scripts/check-skills.mjs
      - name: unit tests
        run: node --test .claude/skills/tickets/scripts/tickets.test.mjs
      - name: backlog validates
        run: node .claude/skills/tickets/scripts/tickets.mjs validate
      - name: index.json is current (D-159 — it is committed)
        # Presence is checked BEFORE regenerating (0315). `git diff` ignores an
        # untracked file, so a commit deleting index.json regenerated it untracked
        # and passed. --error-unmatch asks the committed tree directly.
        run: |
          git ls-files --error-unmatch tickets/index.json >/dev/null 2>&1 \
            || { echo "tickets/index.json is missing from the commit — run 'tickets.mjs index' and commit it"; exit 1; }
          node .claude/skills/tickets/scripts/tickets.mjs index
          git diff --exit-code tickets/index.json \
            || (echo "tickets/index.json is stale — run 'tickets.mjs index' and commit"; exit 1)
