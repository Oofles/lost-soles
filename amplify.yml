version: 1
backend:
  phases:
    build:
      commands:
        # `npm install --no-save` rather than `npm ci` — see D-162. npm ci cannot
        # install the Amplify Gen 2 dependency set at all today: @aws-amplify/
        # data-construct and graphql-api-construct ship internally inconsistent
        # BUNDLED trees. --no-save installs from the committed lock and leaves it
        # byte-identical. Revert to `npm ci` under ticket 0128.
        - npm install --no-save --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        # Post-deploy, and in the BACKEND phase on purpose: this needs both the
        # amplify_outputs.json that pipeline-deploy just wrote and the AWS
        # credentials this phase already holds. Self-signup and guest identities
        # are two booleans a console click can flip back, and source code cannot
        # see that (08-security-privacy.md §5.1, D-163). Both were live-WRONG
        # before 0014. Fails closed: an unreadable posture fails the deploy.
        - node scripts/check-auth-posture.mjs
frontend:
  phases:
    preBuild:
      commands:
        - nvm use            # .nvmrc — pin Node, do not inherit the unpinned setup
        - npm install --no-save --cache .npm --prefer-offline   # D-162, see above
        # THE HOME COORDINATE, INTO .env.production (ticket 0053, D-226-era work).
        #
        # Amplify environment variables reach the BUILD container but NOT the SSR
        # compute runtime. Set at app level and again at branch level, `process.env
        # .LOST_SOLES_HOME_LAT` was still undefined in the server component, so
        # homeCameraForSession() returned null and the map opened on the extract-wide
        # fallback instead of the operator's neighbourhood. Both were verified live,
        # in that order, before resorting to this.
        #
        # This is AWS's documented pattern for the gap. Next.js replaces
        # `process.env.X` with its value AT BUILD TIME, so a variable present in
        # .env.production during the build is present in the deployed server bundle
        # at request time. It reaches the client only if prefixed NEXT_PUBLIC_ —
        # which these deliberately are not — so Next's own rule keeps the coordinate
        # server-side, and the 0053 smoke test asserts the signed-out payload carries
        # no coordinate.
        #
        # VALUES ARE NEVER ECHOED. The redirect writes to the file, not to stdout,
        # and the confirmation prints a COUNT. Amplify build logs are not a place to
        # put the operator's home address (08 §7.2, D-199).
        - env | grep -e '^LOST_SOLES_HOME_' >> .env.production || true
        - echo "home camera vars written to .env.production:" $(grep -c '^LOST_SOLES_HOME_' .env.production || echo 0)
    build:
      commands:
        # These run BEFORE the build, cheapest first. There is no branch
        # protection on this repo (D-163), so the GitHub Actions gate is an alarm
        # and THIS is the lock: the only thing that can actually stop bad code
        # reaching soles.devaultsecurity.com. A failed build leaves the previous
        # deployment live. Keep this list in step with .github/workflows/gate.yml.
        - node scripts/check-boundaries.mjs   # D-100 — milliseconds, guards a map that cannot re-fog
        - node scripts/check-design-tokens.mjs # 06 §8 — the palette does not leak
        - node scripts/check-fixture-geography.mjs # 08 §7.2 / D-199 — no real GPS in a public repo
        - node scripts/check-fog-render-boundary.mjs # 05 §2.3 — REVEAL_R_M is scoring, revealScale is a look
        - node scripts/check-fog-hot-path.mjs  # 02 §5.6 — AP-16 must not reach the ingest hot path
        - node scripts/check-no-deckgl.mjs     # 05 §4.6 — the ruled-out renderer stays ruled out
        - node scripts/build-rules-json.mjs --check # D-217 — the .json the ingest Lambda imports
        # The one expensive check here (~6s): it copies the tree to /tmp, stubs the
        # adapter, and runs tsc over the result. Worth it — it is the only thing
        # that can see a dependency which does not go through an import statement.
        - node scripts/check-adapter-deletion.mjs # D-121.1 — deleting an adapter breaks only registry.ts
        - npm run typecheck  # tsc --noEmit — REAL, not the dead script pattern
        - npm run lint       # eslint — REAL, actually installed and configured
        - npm test           # vitest — carries the T1-T4 boundary tests as they land
        - npm run build
        # AFTER the build, and the only place the LITERAL scan can run: this
        # container holds AWS credentials, so the real secret values come from
        # SSM. --require-literals makes it fail closed — if the SSM read breaks,
        # a pattern-only pass would be a green tick over an unscanned bundle
        # (0017). Scans .next/static, .next/server and the cdk.out Lambda
        # bundles the backend phase wrote earlier in this same container.
        - node scripts/check-bundle-leak.mjs --self-test
        - node scripts/check-bundle-leak.mjs --require-literals
        # Ticket 0053. next.config.ts inlines LOST_SOLES_HOME_* at build time because
        # Amplify's SSR compute has no runtime environment. Static replacement follows
        # the reference, so a client component reading it would put the operator's
        # neighbourhood into a publicly served chunk. Runs HERE, after the build, in
        # the container that actually has the values.
        - node scripts/check-home-not-in-client.mjs --self-test
        - node scripts/check-home-not-in-client.mjs
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
