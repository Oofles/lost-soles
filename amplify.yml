version: 1
backend:
  phases:
    build:
      commands:
        # `npm install --no-save` rather than `npm ci` — see D-162. npm ci cannot
        # install the Amplify Gen 2 dependency set at all today: @aws-amplify/
        # data-construct and graphql-api-construct ship internally inconsistent
        # BUNDLED trees. --no-save installs from the committed lock and leaves it
        # byte-identical. Revert to `npm ci` under ticket 0128.
        - npm install --no-save --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use            # .nvmrc — pin Node, do not inherit the unpinned setup
        - npm install --no-save --cache .npm --prefer-offline   # D-162, see above
    build:
      commands:
        - npm run typecheck  # tsc --noEmit — REAL, not the dead script pattern
        - npm run lint       # eslint — REAL, actually installed and configured
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
      - node_modules/**/*
